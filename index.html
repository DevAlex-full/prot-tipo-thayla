<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thayla Studio — Sistema de Gestão Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#0E0D0B;color:#1A1916;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:'DM Sans',sans-serif;box-sizing:border-box}
button{cursor:pointer}input{outline:none}textarea{outline:none;resize:vertical}

/* ── TOKENS ── */
:root{
  --cream:#FAF9F7;--dark:#0E0D0B;--dark2:#1A1916;--dark3:#252320;
  --gold:#B8975A;--goldD:#8B6E3A;--goldL:#EDE0CC;--goldLL:#F7F0E4;
  --beige:#C9B9A5;--beigeL:#EDE8E1;--beigeLL:#F5F2EE;
  --mid:#59544D;--light:#9E988F;--line:#DDD9D3;--lineD:rgba(201,185,169,.12);
  --white:#FFFFFF;
  --green:#1B8F5A;--greenL:#E3F5EC;
  --red:#C0392B;--redL:#FDEAEA;
  --blue:#2563EB;--blueL:#EBF3FD;
  --purple:#7C3AED;--purpleL:#EDE9FE;
  --shadow:0 1px 3px rgba(26,25,22,.06);
  --shadow2:0 4px 20px rgba(26,25,22,.09);
  --shadow3:0 12px 40px rgba(26,25,22,.14);
  --radius:10px;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(184,151,90,.4)}50%{box-shadow:0 0 0 8px rgba(184,151,90,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}

.ani {animation:fadeUp .45s ease both}
.ani2{animation:fadeUp .45s .08s ease both}
.ani3{animation:fadeUp .45s .16s ease both}
.ani4{animation:fadeUp .45s .24s ease both}
.ani5{animation:fadeUp .45s .32s ease both}
.fad {animation:fadeIn .3s ease both}
.slr {animation:slideR .35s ease both}
.pf  {font-family:'Playfair Display',serif}
.pfi {font-family:'Playfair Display',serif;font-style:italic}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ── GLASSMORPHISM ── */
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(201,185,169,.14)}
.glass-light{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(221,217,211,.6)}

/* ── SKELETON ── */
.skel{background:linear-gradient(90deg,#f0ede9 25%,#e6e2dc 50%,#f0ede9 75%);background-size:1000px 100%;animation:shimmer 1.6s infinite;border-radius:4px}

/* ── GRAIN TEXTURE ── */
.grain::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

/* ── NAV ── */
nav.main-nav{
  position:sticky;top:0;z-index:300;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:62px;
  background:rgba(14,13,11,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--lineD);
  transition:all .3s;
}
nav.main-nav.light-nav{background:rgba(250,249,247,.94);border-bottom-color:var(--line)}
.nav-logo{display:flex;align-items:center;gap:4px;cursor:pointer;text-decoration:none}
.nav-logo-t{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;letter-spacing:4px;color:#fff;transition:color .2s}
.nav-logo-s{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:var(--gold);margin-left:2px}
.light-nav .nav-logo-t{color:var(--dark2)}
.nav-links{display:flex;gap:2px}
.nav-link{background:transparent;border:none;padding:7px 13px;border-radius:6px;font-size:13px;font-weight:400;color:rgba(201,185,169,.7);cursor:pointer;transition:all .15s;letter-spacing:.2px}
.nav-link.active,.nav-link:hover{background:rgba(255,255,255,.07);color:var(--gold)}
.light-nav .nav-link{color:var(--mid)}
.light-nav .nav-link.active,.light-nav .nav-link:hover{background:var(--beigeLL);color:var(--dark2)}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:rgba(201,185,169,.15);border:1.5px solid rgba(184,151,90,.3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--beige);cursor:pointer;transition:all .2s}
.nav-avatar:hover{border-color:var(--gold)}
.btn-nav{background:var(--gold);border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;color:var(--dark2);cursor:pointer;transition:all .15s;letter-spacing:.2px}
.btn-nav:hover{background:var(--goldD);transform:translateY(-1px)}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s,border-color .25s}
.card-hover:hover{box-shadow:var(--shadow3);transform:translateY(-2px)}
.card-dark{background:var(--dark3);border:1px solid var(--lineD)}

/* ── BUTTONS ── */
.btn{border:none;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.btn-primary{background:var(--dark2);color:#fff;padding:13px 24px}
.btn-primary:hover{background:#000;transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--dark2);padding:13px 24px}
.btn-gold:hover{background:var(--goldD);transform:translateY(-1px);box-shadow:0 4px 16px rgba(184,151,90,.35)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--mid);padding:11px 22px}
.btn-outline:hover{border-color:var(--beige);color:var(--dark2)}
.btn-ghost{background:transparent;border:1px solid rgba(201,185,169,.2);color:var(--beige);padding:11px 22px}
.btn-ghost:hover{background:rgba(255,255,255,.06);border-color:rgba(201,185,169,.4)}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:5px}
.btn-full{width:100%}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:4px;letter-spacing:.2px}
.badge-gold{background:var(--goldL);color:#7A5C2E}
.badge-green{background:var(--greenL);color:var(--green)}
.badge-red{background:var(--redL);color:var(--red)}
.badge-blue{background:var(--blueL);color:var(--blue)}
.badge-mid{background:var(--beigeL);color:var(--mid)}
.badge-purple{background:var(--purpleL);color:var(--purple)}

/* ── INPUT ── */
.input-field{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px 14px;font-size:14px;background:var(--white);color:var(--dark2);transition:border-color .2s,box-shadow .2s}
.input-field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,151,90,.12)}
.input-field::placeholder{color:var(--light)}
.label{font-size:12px;font-weight:500;color:var(--mid);margin-bottom:6px;display:block;letter-spacing:.3px}

/* ── DIVIDER ── */
.div{height:1px;background:var(--line)}
.div-d{height:1px;background:var(--lineD)}

/* ── SECTION LABEL ── */
.sec-label{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-label-bar{width:2px;height:16px;background:var(--gold);border-radius:1px;flex-shrink:0}
.sec-label-txt{font-size:11px;letter-spacing:3.5px;color:var(--gold);font-weight:500}

/* ── STATUS DOT ── */
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green);animation:pulse 2s ease-in-out infinite}
.dot-gold{background:var(--gold)}
.dot-red{background:var(--red)}

/* ── PRO CARD ── */
.pro-card{position:relative;overflow:hidden;cursor:pointer}
.pro-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,13,11,.85) 0%,transparent 60%);opacity:0;transition:opacity .3s}
.pro-card:hover .pro-card-overlay{opacity:1}
.pro-card-actions{position:absolute;bottom:20px;left:20px;right:20px;transform:translateY(12px);opacity:0;transition:all .3s}
.pro-card:hover .pro-card-actions{transform:translateY(0);opacity:1}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.timeline-item{position:relative;padding-bottom:20px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-28px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--white)}

/* ── PROGRESS BAR ── */
.prog-bar{height:4px;background:var(--beigeL);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:var(--gold);transition:width .8s ease}

/* ── TABS ── */
.tab-bar{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab-bar::-webkit-scrollbar{height:0}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:13px 20px;font-size:13px;font-weight:400;color:var(--light);cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.2px}
.tab-btn.active{border-bottom-color:var(--dark2);color:var(--dark2);font-weight:500}

/* ── SIDEBAR ── */
.sidebar{width:215px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--lineD)}
.sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px;transition:background .15s;color:rgba(201,185,169,.5);font-size:13px}
.sidebar-nav-item:hover{background:rgba(255,255,255,.05);color:var(--beige)}
.sidebar-nav-item.active{background:rgba(255,255,255,.08);color:var(--white)}
.sidebar-nav-item.active .nav-icon{color:var(--gold)}
.nav-icon{font-size:11px;min-width:14px;transition:color .15s}
.nav-badge{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dark2);font-weight:700;padding:0 4px}

/* ── METRIC CARD ── */
.metric-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:all .25s}
.metric-card:hover{box-shadow:var(--shadow2)}

/* ── CHART BAR ── */
.chart-bar{border-radius:3px 3px 0 0;cursor:pointer;transition:opacity .15s;flex:1;min-width:0}
.chart-bar:hover{opacity:.75}

/* ── ACHIEVEMENT BADGE ── */
.achievement{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:10px;text-align:center;transition:all .25s;cursor:default}
.achievement.earned{background:var(--goldLL);border:1px solid var(--goldL)}
.achievement.locked{background:var(--beigeLL);border:1px solid var(--line);opacity:.55;filter:grayscale(1)}
.achievement-icon{font-size:28px;line-height:1}
.achievement-name{font-size:11px;font-weight:500;color:var(--mid)}

/* ── PIX MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(14,13,11,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:var(--white);border-radius:14px;max-width:460px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:fadeUp .35s ease}
.pix-qr{width:180px;height:180px;background:linear-gradient(135deg,var(--beigeLL),var(--goldLL));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:72px;margin:0 auto}

/* ── CONSENT MODAL ── */
.consent-box{background:var(--white);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:fadeUp .35s ease}
.consent-body{overflow-y:auto;padding:24px;flex:1}
.consent-body::-webkit-scrollbar{width:4px}
.consent-body::-webkit-scrollbar-thumb{background:var(--line)}

/* ── STOCK ── */
.stock-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stock-item:last-child{border-bottom:none}
.stock-level{height:6px;flex:1;background:var(--beigeL);border-radius:3px;overflow:hidden}
.stock-fill-ok{background:var(--green)}
.stock-fill-low{background:var(--gold)}
.stock-fill-crit{background:var(--red)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav.main-nav{padding:0 16px}
  .nav-links{display:none}
  .mobile-menu{display:flex}
  .hero-grid{grid-template-columns:1fr!important}
  .hero-img{display:none!important}
  .services-grid{grid-template-columns:1fr!important}
  .about-grid{grid-template-columns:1fr!important}
  .reviews-grid{grid-template-columns:1fr!important}
  .steps-grid{grid-template-columns:1fr 1fr!important}
  .pros-grid{grid-template-columns:1fr!important}
  .agenda-grid{grid-template-columns:1fr!important}
  .dash-metrics{grid-template-columns:1fr 1fr!important}
  .dash-main{grid-template-columns:1fr!important}
  .dash-bottom{grid-template-columns:1fr!important}
  .client-header-stats{display:none!important}
  .client-tabs-content{padding:16px!important}
  .client-hist-grid{grid-template-columns:1fr!important}
  .profile-grid{grid-template-columns:1fr!important}
  .return-grid{grid-template-columns:1fr!important}
  .care-grid{grid-template-columns:1fr!important}
  .sidebar{display:none}
  .main-content{flex:1}
  .dash-layout{flex-direction:column}
  .mobile-dash-nav{display:flex!important}
  .confirm-grid{grid-template-columns:1fr!important}
  .pro-grid{grid-template-columns:1fr 1fr!important}
  section{padding:48px 20px!important}
  .hero-section{padding:48px 20px 64px!important}
  .hero-h1{font-size:44px!important}
  .footer-grid{grid-template-columns:1fr!important;gap:24px!important}
  .achievements-grid{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:480px){
  .pro-grid{grid-template-columns:1fr!important}
  .dash-metrics{grid-template-columns:1fr!important}
  .achievements-grid{grid-template-columns:1fr 1fr!important}
  .steps-grid{grid-template-columns:1fr!important}
}
.mobile-dash-nav{display:none;background:var(--dark);border-top:1px solid var(--lineD);overflow-x:auto;padding:8px 16px;gap:4px}
.mobile-nav-btn{background:transparent;border:none;padding:8px 12px;border-radius:6px;font-size:12px;color:rgba(201,185,169,.6);cursor:pointer;white-space:nowrap;transition:all .15s}
.mobile-nav-btn.active{background:rgba(255,255,255,.08);color:var(--gold)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
'use strict';
const{useState,useEffect,useRef,useCallback}=React;
const h=React.createElement;

/* ═══ DATA ════════════════════════════════════════════════════ */
const PROFESSIONALS=[
  {id:'thayla',name:'Thayla Nascimento',role:'Fundadora & Body Piercer',spec:['Piercing Premium','Joia & Expansão','Consulta Gratuita'],exp:'8 anos',rating:4.9,reviews:247,commission:70,status:'disponível',avatar:'T',color:'#B8975A',bio:'Certificada ABPB. Especialista em piercings de precisão com materiais importados. Referência em biossegurança e técnica minimamente invasiva.',services:['Piercing Premium','Joia & Expansão','Consulta Gratuita','Retoque & Correção']},

  {id:'lucas',name:'Lucas Ferreira',role:'Tattoo Artist — Realismo',spec:['Hiper-Realismo','Retrato','Natureza'],exp:'7 anos',rating:4.9,reviews:189,commission:60,status:'em sessão',avatar:'L',color:'#5AB88A',bio:'Especialista em realismo e hiper-realismo, com técnica de sombreado premiada. Cada obra é única, desenvolvida a partir de referências exclusivas do cliente.',services:['Tattoo Realismo','Tattoo Fine Line','Consulta Gratuita']},

const SERVICES=[
  {icon:'◎',name:'Piercing Premium',desc:'Titânio e ouro 18k. Antisséptico rigoroso, técnica precisa para resultados duradouros.',price:'R$ 120',dur:'30 min',tag:'mais popular',prof:['thayla']},
  {icon:'✦',name:'Tattoo Fine Line',desc:'Traços delicados que envelhecem com beleza. Arte minimalista de autoria exclusiva.',price:'R$ 250',dur:'1–3h',tag:'',prof:['joao','lucas']},
  {icon:'◉',name:'Tattoo Realismo',desc:'Hiper-realismo com sombreados e detalhes que ganham vida. Obras únicas e assinadas.',price:'sob consulta',dur:'3–8h',tag:'',prof:['lucas']},
  {icon:'◈',name:'Joia & Expansão',desc:'Expansores artesanais, joias de titânio ASTM F136 e aço cirúrgico certificado.',price:'R$ 80',dur:'20 min',tag:'',prof:['thayla']},

const REVIEWS=[
  {name:'Mariana S.',city:'São Paulo',stars:5,text:'Experiência incrível! Sensibilidade única, cada detalhe foi pensado. Meu piercing ficou perfeito e o cuidado no pós foi impecável.',proc:'Piercing Premium'},
  {name:'Camila R.',city:'São Paulo',stars:5,text:'Fiz minha primeira tattoo com o João. O espaço é lindo, limpo, e o resultado superou completamente minhas expectativas.',proc:'Fine Line'},
  {name:'Fernanda L.',city:'Campinas',stars:5,text:'Voltei pela terceira vez e saio sempre encantada. Atenção ao detalhe é o diferencial que não encontrei em mais nenhum lugar.',proc:'Realismo'},
  {name:'Beatriz M.',city:'São Paulo',stars:5,text:'Fine line impecável. A Thayla tem um olhar artístico que transforma qualquer referência em algo ainda mais bonito.',proc:'Fine Line'},
];

const T={
  cream:'#FAF9F7',dark:'#0E0D0B',dark2:'#1A1916',dark3:'#252320',
  gold:'#B8975A',goldD:'#8B6E3A',goldL:'#EDE0CC',goldLL:'#F7F0E4',
  beige:'#C9B9A5',beigeL:'#EDE8E1',beigeLL:'#F5F2EE',
  mid:'#59544D',light:'#9E988F',line:'#DDD9D3',white:'#FFFFFF',
  green:'#1B8F5A',greenL:'#E3F5EC',red:'#C0392B',redL:'#FDEAEA',
  blue:'#2563EB',blueL:'#EBF3FD',purple:'#7C3AED',purpleL:'#EDE9FE',
};

/* ═══ MINI COMPONENTS ════════════════════════════════════════ */
const SectionLabel=({children,light})=>
  h('div',{className:'sec-label'},
    h('div',{className:'sec-label-bar'}),
    h('span',{className:'sec-label-txt',style:light?{color:T.gold}:{color:T.gold}},children)
  );

const Badge=({children,type='gold'})=>h('span',{className:`badge badge-${type}`},children);
const Divider=({my=16,dark})=>h('div',{className:dark?'div-d':'div',style:{margin:`${my}px 0`}});

const Btn=({children,onClick,variant='primary',full,small,style:s,disabled})=>
  h('button',{
    onClick,disabled,
    className:`btn btn-${variant}${full?' btn-full':''}${small?' btn-sm':''}`,
    style:{opacity:disabled?.5:1,...s}
  },children);

const Card=({children,style:s,onClick,hover,dark:dk})=>
  h('div',{
    onClick,
    className:`card${hover?' card-hover':''}${dk?' card-dark':''}`,
    style:{cursor:onClick?'pointer':'default',...s}
  },children);

/* ═══ NAV ════════════════════════════════════════════════════ */
function Nav({page,setPage}){
  const isLight=['agenda','galeria','cliente','professionals'].includes(page);
  const links=[['landing','Início'],['professionals','Profissionais'],['agenda','Agendar'],['galeria','Galeria'],['dashboard','Admin'],['cliente','Minha Área']];
  return h('nav',{className:`main-nav${isLight?' light-nav':''}`},
    h('div',{className:'nav-logo',onClick:()=>setPage('landing')},
      h('span',{className:'nav-logo-t'},'THAYLA'),
      h('span',{className:'nav-logo-s'},' Studio'),
    ),
    h('div',{className:'nav-links'},
      links.map(([id,label])=>
        h('button',{key:id,className:`nav-link${page===id?' active':''}`,onClick:()=>setPage(id)},label)
      )
    ),
    h('div',{className:'nav-actions'},
      h('div',{className:'nav-avatar',onClick:()=>setPage('cliente')},'M'),
      h('button',{className:'btn-nav',onClick:()=>setPage('agenda')},'Agendar →'),
    )
  );
}
