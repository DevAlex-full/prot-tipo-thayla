<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thayla Studio — Protótipo Completo</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #FAF9F7;
      color: #1A1916;
      min-height: 100vh;
    }
    .pf  { font-family: 'Playfair Display', serif; }
    .pfi { font-family: 'Playfair Display', serif; font-style: italic; }
    button, input, select, textarea {
      font-family: 'DM Sans', sans-serif;
      box-sizing: border-box;
    }
    button { cursor: pointer; }
    input  { outline: none; }

    /* Animations */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .ani  { animation: fadeUp  .45s ease both; }
    .ani2 { animation: fadeUp  .45s .08s ease both; }
    .ani3 { animation: fadeUp  .45s .16s ease both; }
    .ani4 { animation: fadeUp  .45s .24s ease both; }
    .fad  { animation: fadeIn  .30s ease both; }
    .sli  { animation: slideIn .35s ease both; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DDD9D3; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    'use strict';
    const { useState, useEffect } = React;
    const h = React.createElement;

    /* ─── DESIGN TOKENS ───────────────────────────────────── */
    const T = {
      cream:   '#FAF9F7',
      dark:    '#1A1916',
      gold:    '#B8975A',
      goldL:   '#EDE0CC',
      goldLL:  '#F7F0E4',
      beige:   '#C9B9A5',
      beigeL:  '#EDE8E1',
      beigeLL: '#F5F2EE',
      mid:     '#59544D',
      light:   '#9E988F',
      line:    '#DDD9D3',
      white:   '#FFFFFF',
      green:   '#1B8F5A',
      greenL:  '#E3F5EC',
      red:     '#C0392B',
      redL:    '#FDEAEA',
      blue:    '#2563EB',
      blueL:   '#EBF3FD',
    };

    /* ─── SHARED DATA ─────────────────────────────────────── */
    const SERVICES = [
      { icon: '◎', name: 'Piercing Premium',    desc: 'Titânio e ouro 18k. Antisséptico rigoroso, técnica precisa para resultados duradouros.',       price: 'R$ 120',      dur: '30 min', tag: 'mais popular' },
      { icon: '✦', name: 'Tattoo Fine Line',     desc: 'Traços delicados que envelhecem com beleza. Arte minimalista de autoria exclusiva.',              price: 'R$ 250',      dur: '1–3h',   tag: '' },
      { icon: '◉', name: 'Tattoo Realismo',      desc: 'Hiper-realismo com sombreados e detalhes que ganham vida. Obras únicas e assinadas.',             price: 'sob consulta',dur: '3–8h',   tag: '' },
      { icon: '◈', name: 'Joia & Expansão',      desc: 'Expansores artesanais, joias de titânio ASTM F136 e aço cirúrgico certificado.',                 price: 'R$ 80',       dur: '20 min', tag: '' },
      { icon: '◆', name: 'Retoque & Correção',   desc: 'Revitalização de trabalhos anteriores. Contornos, correção cromática e saturação.',               price: 'sob consulta',dur: '1–2h',   tag: '' },
      { icon: '✿', name: 'Consulta Gratuita',    desc: 'Avaliação sem compromisso para tirar dúvidas, ver portfólio e planejar seu projeto.',             price: 'grátis',      dur: '30 min', tag: '' },
    ];

    const REVIEWS = [
      { name: 'Mariana S.', city: 'São Paulo', stars: 5, text: 'Experiência incrível! Sensibilidade única, cada detalhe foi pensado. Meu piercing ficou perfeito e o cuidado no pós foi impecável.' },
      { name: 'Camila R.',  city: 'São Paulo', stars: 5, text: 'Fiz minha primeira tattoo com a Thayla. O espaço é lindo, limpo, e o resultado superou completamente minhas expectativas.' },
      { name: 'Fernanda L.',city: 'Campinas',  stars: 5, text: 'Voltei pela terceira vez e saio sempre encantada. Atenção ao detalhe é o diferencial que não encontrei em mais nenhum lugar.' },
      { name: 'Beatriz M.', city: 'São Paulo', stars: 5, text: 'Fine line impecável. A Thayla tem um olhar artístico que transforma qualquer referência em algo ainda mais bonito.' },
    ];

    /* ─── MINI COMPONENTS ─────────────────────────────────── */
    const Badge = ({ children, c = T.gold, bg = T.goldL }) =>
      h('span', {
        style: {
          background: bg, color: c, fontSize: 11, fontWeight: 500,
          padding: '3px 10px', borderRadius: 4,
          display: 'inline-flex', alignItems: 'center', gap: 4,
        },
      }, children);

    const Divider = ({ my = 16 }) =>
      h('div', { style: { height: 1, background: T.line, margin: `${my}px 0` } });

    const Btn = ({ children, onClick, full, variant = 'primary', small, style: s }) =>
      h('button', {
        onClick,
        style: {
          width: full ? '100%' : 'auto',
          background: variant === 'primary' ? T.dark : variant === 'gold' ? T.gold : 'transparent',
          border: variant === 'outline' ? `1px solid ${T.line}` : 'none',
          color: variant === 'primary' ? T.white : variant === 'gold' ? T.dark : T.mid,
          padding: small ? '9px 18px' : '13px 24px',
          borderRadius: 6, fontSize: small ? 12 : 14, fontWeight: 500,
          cursor: 'pointer', letterSpacing: 0.3, transition: 'opacity .15s',
          ...s,
        },
      }, children);

    const Card = ({ children, style: s, onClick, hover }) =>
      h('div', {
        onClick,
        style: {
          background: T.white, border: `1px solid ${T.line}`, borderRadius: 10,
          boxShadow: '0 1px 3px rgba(26,25,22,.05)',
          transition: 'box-shadow .2s', cursor: onClick ? 'pointer' : 'default',
          ...s,
        },
        onMouseEnter: el => hover && (el.currentTarget.style.boxShadow = '0 4px 16px rgba(26,25,22,.1)'),
        onMouseLeave: el => hover && (el.currentTarget.style.boxShadow = '0 1px 3px rgba(26,25,22,.05)'),
      }, children);

    const SectionLabel = ({ children }) =>
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 } },
        h('div', { style: { width: 2, height: 16, background: T.gold, borderRadius: 1, flexShrink: 0 } }),
        h('span', { style: { fontSize: 11, letterSpacing: 3.5, color: T.gold, fontWeight: 500 } }, children),
      );

    /* ─── NAV ─────────────────────────────────────────────── */
    function Nav({ page, setPage }) {
      const dark = page === 'landing' || page === 'dashboard';
      const links = [['landing','Início'],['agenda','Agendar'],['galeria','Galeria'],['dashboard','Admin'],['cliente','Minha Área']];
      return h('nav', {
        style: {
          background: dark ? T.dark : T.white,
          borderBottom: `1px solid ${dark ? 'rgba(201,185,169,.12)' : T.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 32px', height: 60,
          position: 'sticky', top: 0, zIndex: 200,
        },
      },
        h('div', {
          style: { display: 'flex', alignItems: 'center', gap: 3, cursor: 'pointer' },
          onClick: () => setPage('landing'),
        },
          h('span', { style: { fontFamily: "'Playfair Display',serif", fontWeight: 700, fontSize: 15, letterSpacing: 4, color: dark ? T.white : T.dark } }, 'THAYLA'),
          h('span', { style: { fontFamily: "'Playfair Display',serif", fontStyle: 'italic', fontSize: 15, color: T.gold, marginLeft: 2 } }, ' Studio'),
        ),
        h('div', { style: { display: 'flex', gap: 2 } },
          links.map(([id, label]) =>
            h('button', {
              key: id, onClick: () => setPage(id),
              style: {
                background: page === id ? (dark ? 'rgba(255,255,255,.08)' : T.beigeLL) : 'transparent',
                border: 'none', padding: '7px 14px', borderRadius: 5,
                fontSize: 13, fontWeight: page === id ? 500 : 400,
                color: page === id ? T.gold : (dark ? T.beige : T.mid),
                cursor: 'pointer', transition: 'all .15s',
              },
            }, label),
          ),
        ),
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
          h('div', {
            style: {
              position: 'relative', cursor: 'pointer',
              width: 34, height: 34, borderRadius: '50%',
              background: dark ? 'rgba(201,185,169,.15)' : T.beigeL,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 13, fontWeight: 500, color: dark ? T.beige : T.mid,
            },
            onClick: () => setPage('cliente'),
          }, 'M'),
          h(Btn, { onClick: () => setPage('agenda'), variant: 'gold', small: true }, 'Agendar →'),
        ),
      );
    }

    /* ─── LANDING ─────────────────────────────────────────── */
    function Landing({ setPage }) {
      const [activeReview, setActiveReview] = useState(0);
      const [activeService, setActiveService] = useState(null);
      useEffect(() => {
        const t = setInterval(() => setActiveReview(r => (r + 1) % REVIEWS.length), 4000);
        return () => clearInterval(t);
      }, []);

      return h('div', { className: 'ani' },
        /* HERO */
        h('section', {
          style: {
            background: T.dark, padding: '60px 48px 80px',
            position: 'relative', overflow: 'hidden', minHeight: 600,
          },
        },
          h('div', { style: { position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(ellipse 60% 80% at 80% 50%,rgba(184,151,90,.07) 0%,transparent 70%)' } }),
          h('div', { style: { position: 'absolute', right: '5%', top: '8%', width: 480, height: 480, borderRadius: '50%', border: '1px solid rgba(184,151,90,.1)' } }),
          h('div', { style: { position: 'absolute', right: '15%', top: '18%', width: 280, height: 280, borderRadius: '50%', border: '1px solid rgba(201,185,169,.07)' } }),
          h('div', {
            style: {
              maxWidth: 1100, margin: '0 auto', position: 'relative', zIndex: 1,
              display: 'grid', gridTemplateColumns: '1fr 360px', gap: 60, alignItems: 'center',
            },
          },
            /* LEFT */
            h('div', null,
              h(SectionLabel, null, 'BODY ART & TATTOO STUDIO — SP'),
              h('h1', {
                className: 'pfi ani2',
                style: { fontSize: 62, lineHeight: 1.08, color: T.white, marginBottom: 20, fontWeight: 400, whiteSpace: 'pre-line' },
              }, 'Arte que\nTransforma\nIdentidades.'),
              h('p', {
                className: 'ani3',
                style: { fontSize: 16, color: T.beige, lineHeight: 1.8, marginBottom: 36, maxWidth: 420 },
              }, 'Piercing & Tattoo de alta precisão em São Paulo. Um espaço criado para quem valoriza a estética, o cuidado e cada detalhe da experiência.'),
              h('div', { className: 'ani4', style: { display: 'flex', gap: 12, marginBottom: 52, flexWrap: 'wrap' } },
                h('button', {
                  onClick: () => setPage('agenda'),
                  style: { background: T.gold, border: 'none', padding: '14px 28px', borderRadius: 6, fontSize: 14, fontWeight: 500, color: T.dark, cursor: 'pointer' },
                }, 'Agendar Consulta'),
                h('button', {
                  onClick: () => setPage('galeria'),
                  style: { background: 'transparent', border: '1px solid rgba(201,185,169,.28)', padding: '14px 28px', borderRadius: 6, fontSize: 14, color: T.beige, cursor: 'pointer' },
                }, 'Ver Portfólio →'),
              ),
              h('div', { style: { display: 'flex', gap: 0, flexWrap: 'wrap' } },
                [['500+','Clientes'],['8','Anos de Exp.'],['98%','Satisfação'],['2k+','Procedimentos']].map(([n, l], i) =>
                  h('div', {
                    key: i,
                    style: {
                      paddingRight: 24, marginRight: 24, paddingBottom: 8,
                      borderRight: i < 3 ? '1px solid rgba(201,185,169,.18)' : 'none',
                    },
                  },
                    h('div', { className: 'pf', style: { fontSize: 26, fontWeight: 700, color: T.gold, lineHeight: 1 } }, n),
                    h('div', { style: { fontSize: 11, color: T.beige, marginTop: 3 } }, l),
                  ),
                ),
              ),
            ),
            /* RIGHT – photo placeholder */
            h('div', { style: { position: 'relative' } },
              h('div', {
                style: {
                  background: 'rgba(201,185,169,.1)', borderRadius: 10, height: 440,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                  border: '1px solid rgba(184,151,90,.2)', position: 'relative', overflow: 'hidden',
                },
              },
                h('div', { style: { position: 'absolute', inset: 0, background: 'linear-gradient(to bottom,transparent 60%,rgba(26,25,22,.4))' } }),
                h('div', { style: { textAlign: 'center', position: 'relative' } },
                  h('div', {
                    style: {
                      width: 72, height: 72, borderRadius: '50%',
                      background: 'rgba(184,151,90,.18)', margin: '0 auto 14px',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: 28, border: '1px solid rgba(184,151,90,.25)',
                    },
                  }, '✦'),
                  h('p', { style: { color: T.beige, fontSize: 13, opacity: 0.5 } }, '[ Foto da Thayla ]'),
                ),
                h('div', { style: { position: 'absolute', bottom: 20, left: 20, right: 20 } },
                  h('div', {
                    style: {
                      background: 'rgba(26,25,22,.75)', borderRadius: 8, padding: '12px 16px',
                      border: '1px solid rgba(184,151,90,.2)',
                    },
                  },
                    h('div', { style: { fontSize: 13, fontWeight: 500, color: T.white } }, 'Thayla Nascimento'),
                    h('div', { style: { fontSize: 11, color: T.gold, marginTop: 2 } }, 'Fundadora & Artista Principal · Certificada ABPB'),
                  ),
                ),
              ),
              h('div', { style: { position: 'absolute', top: 14, right: -14, width: '100%', height: '100%', border: '1px solid rgba(184,151,90,.15)', borderRadius: 10, zIndex: -1 } }),
            ),
          ),
        ),

        /* SERVICES */
        h('section', { style: { padding: '72px 48px', background: T.cream } },
          h('div', { style: { maxWidth: 1100, margin: '0 auto' } },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 48, flexWrap: 'wrap', gap: 16 } },
              h('div', null,
                h(SectionLabel, null, 'SERVIÇOS'),
                h('h2', { className: 'pfi', style: { fontSize: 42, lineHeight: 1.15, fontWeight: 400 } }, 'Uma experiência\ncompleta em arte.'),
              ),
              h('div', { style: { textAlign: 'right', maxWidth: 280 } },
                h('p', { style: { fontSize: 15, color: T.mid, lineHeight: 1.75 } }, 'Cada procedimento com técnica refinada, materiais premium e atenção absoluta.'),
                h('button', {
                  onClick: () => setPage('agenda'),
                  style: { marginTop: 14, background: 'transparent', border: `1px solid ${T.line}`, padding: '9px 18px', borderRadius: 6, fontSize: 13, color: T.mid, cursor: 'pointer' },
                }, 'Ver todos os serviços →'),
              ),
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 16 } },
              SERVICES.map((s, i) =>
                h(Card, {
                  key: i, hover: true,
                  onClick: () => setActiveService(activeService === i ? null : i),
                  style: {
                    padding: 24, cursor: 'pointer',
                    borderColor: activeService === i ? T.gold : T.line,
                    borderWidth: activeService === i ? 1.5 : 1,
                  },
                },
                  h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 } },
                    h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                      h('span', { style: { fontSize: 20, color: T.gold } }, s.icon),
                      h('span', { className: 'pf', style: { fontSize: 12, fontStyle: 'italic', color: T.light, fontWeight: 700 } }, `0${i + 1}`),
                    ),
                    s.tag && h(Badge, { c: '#7A5C2E', bg: T.goldL }, s.tag),
                  ),
                  h(Divider, { my: 0 }),
                  h('h3', { className: 'pfi', style: { fontSize: 19, fontWeight: 400, margin: '14px 0 10px', lineHeight: 1.3 } }, s.name),
                  h('p', { style: { fontSize: 13, color: T.mid, lineHeight: 1.7, marginBottom: 20 } }, s.desc),
                  h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    h(Badge, { c: '#7A5C2E', bg: T.goldLL }, s.price),
                    h('span', { style: { fontSize: 12, color: T.light } }, s.dur),
                  ),
                  activeService === i && h('div', { className: 'fad', style: { marginTop: 14, padding: 12, background: T.beigeLL, borderRadius: 6 } },
                    h('p', { style: { fontSize: 12, color: T.mid, lineHeight: 1.6 } }, 'Agende uma consulta gratuita para conversarmos sobre o seu projeto personalizado.'),
                    h('button', {
                      onClick: e => { e.stopPropagation(); setPage('agenda'); },
                      style: { marginTop: 10, background: T.gold, border: 'none', padding: '8px 16px', borderRadius: 5, fontSize: 12, fontWeight: 500, color: T.dark, cursor: 'pointer' },
                    }, 'Agendar este serviço →'),
                  ),
                ),
              ),
            ),
          ),
        ),

        /* ABOUT */
        h('section', { style: { background: T.dark, padding: '72px 48px' } },
          h('div', { style: { maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '380px 1fr', gap: 80, alignItems: 'center' } },
            h('div', { style: { position: 'relative' } },
              h('div', {
                style: {
                  background: 'rgba(201,185,169,.08)', borderRadius: 10, height: 460,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                  border: '1px solid rgba(184,151,90,.18)', position: 'relative', overflow: 'hidden',
                },
              },
                h('div', { style: { width: 80, height: 80, borderRadius: '50%', background: 'rgba(184,151,90,.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 32, marginBottom: 12, border: '1px solid rgba(184,151,90,.2)' } }, '✦'),
                h('p', { style: { color: T.beige, fontSize: 12, opacity: 0.4 } }, '[ Foto Thayla ]'),
                h('div', { style: { position: 'absolute', bottom: 0, left: 0, right: 0, padding: '0 20px 20px' } },
                  h('div', {
                    style: { background: 'rgba(26,25,22,.75)', borderRadius: 7, padding: '12px 16px', border: '1px solid rgba(184,151,90,.15)' },
                  },
                    h('div', { style: { display: 'flex', gap: 20, flexWrap: 'wrap' } },
                      [['ABPB','Certificada'],['Biosseg.','Classe A'],['10k+','Clientes']].map(([v, l]) =>
                        h('div', { key: v },
                          h('div', { style: { fontSize: 13, fontWeight: 500, color: T.gold } }, v),
                          h('div', { style: { fontSize: 10, color: T.beige, opacity: 0.6 } }, l),
                        ),
                      ),
                    ),
                  ),
                ),
              ),
              h('div', { style: { position: 'absolute', top: 14, right: -14, width: '100%', height: '100%', border: '1px solid rgba(184,151,90,.12)', borderRadius: 10, zIndex: -1 } }),
            ),
            h('div', null,
              h(SectionLabel, null, 'SOBRE A THAYLA'),
              h('h2', { className: 'pfi', style: { fontSize: 38, lineHeight: 1.2, color: T.white, marginBottom: 20, fontWeight: 400, whiteSpace: 'pre-line' } }, 'Mais de 8 anos\ntransformando peles\nem obras de arte.'),
              h('p', { style: { fontSize: 15, color: T.beige, lineHeight: 1.85, marginBottom: 20 } }, 'Especialista certificada em piercing e tattoo, Thayla combina técnica apurada com sensibilidade artística única. Cada projeto começa com uma conversa — porque entender sua história é parte essencial da criação.'),
              h('p', { style: { fontSize: 15, color: T.beige, lineHeight: 1.85, marginBottom: 32, opacity: 0.8 } }, 'Seu espaço foi projetado para oferecer conforto, privacidade e uma experiência que vai além do procedimento: é um ritual de autoexpressão.'),
              h(Divider, { my: 0 }),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginTop: 24 } },
                [
                  ['✦  Certificada ABPB', 'Associação Brasileira de Piercing'],
                  ['◎  Materiais Importados', 'Titânio ASTM F136 & Ouro 18k'],
                  ['◉  Biossegurança Total', 'Protocolo rigoroso e esterilizado'],
                  ['◆  Atendimento Privativo', 'Sala exclusiva, sem pressa'],
                ].map(([t, s]) =>
                  h('div', {
                    key: t,
                    style: { padding: 14, background: 'rgba(255,255,255,.04)', borderRadius: 7, border: '1px solid rgba(201,185,169,.1)' },
                  },
                    h('div', { style: { fontSize: 12, fontWeight: 500, color: T.white, marginBottom: 4 } }, t),
                    h('div', { style: { fontSize: 11, color: T.beige, opacity: 0.6, lineHeight: 1.5 } }, s),
                  ),
                ),
              ),
            ),
          ),
        ),

        /* REVIEWS */
        h('section', { style: { padding: '72px 48px', background: T.cream } },
          h('div', { style: { maxWidth: 1100, margin: '0 auto' } },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 48, flexWrap: 'wrap', gap: 16 } },
              h('div', null,
                h(SectionLabel, null, 'AVALIAÇÕES'),
                h('h2', { className: 'pfi', style: { fontSize: 42, lineHeight: 1.15, fontWeight: 400 } }, 'O que nossas\nclientes dizem.'),
              ),
              h('div', { style: { textAlign: 'right' } },
                h('div', { style: { fontSize: 26, color: T.gold, marginBottom: 4 } }, '★★★★★'),
                h('div', { style: { fontSize: 14, fontWeight: 500 } }, '4.9 / 5.0'),
                h('div', { style: { fontSize: 12, color: T.light, marginTop: 3 } }, '200+ avaliações verificadas'),
              ),
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 16, marginBottom: 20 } },
              REVIEWS.map((r, i) =>
                h(Card, {
                  key: i,
                  onClick: () => setActiveReview(i),
                  style: {
                    padding: 28,
                    background: activeReview === i ? T.beigeLL : T.white,
                    borderColor: activeReview === i ? T.gold : T.line,
                    cursor: 'pointer', transition: 'all .3s',
                  },
                },
                  h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 } },
                    h('div', { style: { fontSize: 13, color: T.gold } }, '★'.repeat(r.stars)),
                    h('div', { className: 'pfi', style: { fontSize: 44, color: T.goldL, lineHeight: 0.8, fontWeight: 700 } }, '"'),
                  ),
